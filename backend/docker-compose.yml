services:
  db:
    # pgvector ships official images pre-built on top of the Postgres image.
    image: pgvector/pgvector:pg17
    container_name: peoplepay360-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: peoplepay
      POSTGRES_PASSWORD: peoplepay
      POSTGRES_DB: peoplepay360
      # Deterministic collation so ORDER BY is identical across machines
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - peoplepay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peoplepay -d peoplepay360"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  peoplepay_pgdata:
